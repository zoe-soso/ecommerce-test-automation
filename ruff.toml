# Ruff 配置 —— 只抓真 bug，不纠结代码风格
#
# 设计原则：
#   本项目已有一套既定代码风格，全面启用格式规则会产生海量噪音改动。
#   这里只启用 F（Pyflakes）一组规则，专门拦截：
#     F811  同名函数/类重复定义（曾在 base_page.py 出现 is_visible 定义两遍）
#     F821  未定义名称
#     F401  导入了但没用
#     F841  赋值后从未使用
#   等真 bug。格式统一留给以后有需要时再开 E/W 规则。

line-length = 100

[lint]
select = ["F"]
