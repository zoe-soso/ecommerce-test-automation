name: Ecommerce UI Automation Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      browsers:
        description: "Browsers to run (comma separated, e.g. chromium or chromium,firefox,webkit)"
        required: false
        default: "chromium"
        type: choice
        options:
          - chromium
          - firefox
          - webkit
          - chromium,firefox,webkit

permissions:
  contents: read
  actions: read

env:
  BROWSERS: ${{ github.event.inputs.browsers || 'chromium' }}

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 配置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # 3. 安装 Python 依赖
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Framework regression tests
        run: python -m pytest unit_tests -o addopts= -p no:cacheprovider -q

      # 4. 安装 Playwright 浏览器驱动（CI 默认只装 chromium，避免首次运行过慢；workflow_dispatch 可指定多浏览器）
      - name: Install Playwright browsers
        run: |
          IFS=',' read -ra browsers <<< "$BROWSERS"
          for browser in "${browsers[@]}"; do
            case "$browser" in chromium|firefox|webkit) ;; *) exit 1 ;; esac
          done
          playwright install --with-deps "${browsers[@]}"

      # 5. 定位上一次成功的运行 ID
      # actions/download-artifact@v4 默认只下载「当前 workflow run」的 artifact，
      # 跨 run 下载必须显式给出 run-id 与 github-token；
      # 少了这一步，每次拿到的都是空目录，Allure 趋势图永远是空的。
      - name: Resolve last successful run
        id: last_run
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'test.yml',
              status: 'success',
              per_page: 1
            });
            const list = runs.data.workflow_runs;
            if (list.length > 0) {
              core.setOutput('id', list[0].id);
              core.info('last successful run: ' + list[0].id);
            } else {
              core.info('no previous successful run found');
            }

      # 6. 下载上一次运行的 Allure history（用于趋势对比）
      # 没有历史记录时 continue-on-error 让 Job 不会因此失败
      - name: Download previous Allure history
        if: steps.last_run.outputs.id != ''
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: allure-history
          path: previous-allure
          run-id: ${{ steps.last_run.outputs.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Allure history
        run: |
          HISTORY_DIR=previous-allure
          if [ -d previous-allure/history ]; then
            HISTORY_DIR=previous-allure/history
          fi
          if compgen -G "$HISTORY_DIR/*.json" > /dev/null; then
            mkdir -p reports/allure-results/history
            cp "$HISTORY_DIR/"*.json reports/allure-results/history/
          fi

      # 7. 执行测试
      # CI 默认只跑 chromium，速度快且稳定；本地或 workflow_dispatch 可触发多浏览器回归
      # 用 -o addopts= 覆盖 pytest.ini 里硬编码的多浏览器，避免浏览器参数重复叠加
      - name: Run tests
        id: pytest
        run: |
          BASE_OPTS="-vs --reruns 1 --reruns-delay 2 --html=reports/report.html --self-contained-html --alluredir=reports/allure-results"
          IFS=',' read -ra browsers <<< "$BROWSERS"
          args=()
          for browser in "${browsers[@]}"; do args+=(--browser "$browser"); done
          pytest -p no:cacheprovider -o addopts="$BASE_OPTS" "${args[@]}"
        continue-on-error: true

      # 8. 生成 Allure 报告（测试失败也要生成，否则看不到失败详情）
      - name: Generate Allure report
        if: always()
        run: |
          npm install -g allure-commandline
          allure generate reports/allure-results -o reports/allure-report --clean

      # 9. 上传产物（失败时也能拿到截图、日志、Allure 报告）
      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: reports/allure-report
          retention-days: 30

      - name: Upload Allure history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-history
          path: reports/allure-report/history
          retention-days: 30

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          retention-days: 14

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: logs/
          retention-days: 14

      # 10. 最终判定：如果 pytest 失败，整个 Job 也标红
      - name: Check pytest result
        if: steps.pytest.outcome == 'failure'
        run: exit 1
